# .gitlab-ci.yml
stages:
  - test
  - build
  - deploy
  - rollback

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# ─── CACHE ───────────────────────────────────────────────────
.maven-cache: &maven-cache
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

.npm-cache: &npm-cache
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - client/node_modules

# ═══════════════════════════════════════════════════════════════
# STAGE 1: TEST
# ═══════════════════════════════════════════════════════════════

test:backend:
  stage: test
  image: eclipse-temurin:17-jdk
  <<: *maven-cache
  before_script:
    - chmod +x server/mvnw
    - |
      if [ -f server/src/test/resources/application-test.properties ]; then
        cp server/src/test/resources/application-test.properties server/src/test/resources/test.properties
      fi
  script:
    - cd server && ./mvnw -B test
  only:
    - main
    - merge_requests
  artifacts:
    when: always
    reports:
      junit:
        - server/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

test:frontend:
  stage: test
  image: node:20-alpine
  <<: *npm-cache
  before_script:
    - cd client && npm ci --legacy-peer-deps
  script:
    - cd client && npm run build
  only:
    - main
    - merge_requests
  artifacts:
    paths:
      - client/dist
    expire_in: 1 hour

# ═══════════════════════════════════════════════════════════════
# STAGE 2: BUILD
# ═══════════════════════════════════════════════════════════════

build:backend:
  stage: build
  image: eclipse-temurin:17-jdk
  <<: *maven-cache
  before_script:
    - chmod +x server/mvnw
    - |
      if [ -f server/src/test/resources/application-test.properties ]; then
        cp server/src/test/resources/application-test.properties server/src/test/resources/test.properties
      fi
  script:
    - cd server && ./mvnw -B package -DskipTests
  only:
    - main
  artifacts:
    paths:
      - server/target/*.jar
    exclude:
      - server/target/*-original.jar
    expire_in: 1 hour

build:frontend:
  stage: build
  image: node:20-alpine
  <<: *npm-cache
  before_script:
    - cd client && npm ci --legacy-peer-deps
  script:
    - cd client && npm run build
  only:
    - main
  artifacts:
    paths:
      - client/dist
    expire_in: 1 hour

# ═══════════════════════════════════════════════════════════════
# STAGE 3: DEPLOY
# ═══════════════════════════════════════════════════════════════

deploy:production:
  stage: deploy
  image: alpine:latest
  needs:
    - build:backend
    - build:frontend
  before_script:
    - apk add --no-cache openssh-client sshpass curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
  script:
    # Tìm file jar
    - JAR_FILE=$(ls server/target/*.jar | grep -v original | head -n 1)
    - echo ">> Deploying JAR $JAR_FILE"

    # Copy jar lên VPS
    - sshpass -p "$VPS_PASSWORD" scp -P "$VPS_PORT" "$JAR_FILE" "$VPS_USER@$VPS_HOST:/tmp/rrms-new.jar"

    # Copy frontend dist lên VPS
    - sshpass -p "$VPS_PASSWORD" scp -P "$VPS_PORT" -r client/dist "$VPS_USER@$VPS_HOST:/tmp/rrms-dist"

    # Copy rollback script nếu có
    - |
      if [ -f scripts/rollback.sh ]; then
        sshpass -p "$VPS_PASSWORD" scp -P "$VPS_PORT" scripts/rollback.sh "$VPS_USER@$VPS_HOST:/tmp/rollback.sh"
      fi

    # SSH vào VPS: backup + swap + restart
    - |
      sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
        set -e

        mkdir -p /var/www/rrms/server/target /var/www/rrms/client /var/www/rrms/releases

        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        RELEASE_DIR="/var/www/rrms/releases/${TIMESTAMP}"
        mkdir -p "$RELEASE_DIR"
        echo ">> Backing up to $RELEASE_DIR"

        [ -f /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar ] && \
          cp /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar "$RELEASE_DIR/"
        [ -d /var/www/rrms/client/dist ] && \
          cp -r /var/www/rrms/client/dist "$RELEASE_DIR/"

        cd /var/www/rrms/releases && ls -1t | tail -n +6 | xargs -I{} rm -rf {} ; cd -

        mv -f /tmp/rrms-new.jar /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar
        rm -rf /var/www/rrms/client/dist
        mv /tmp/rrms-dist /var/www/rrms/client/dist

        [ -f /tmp/rollback.sh ] && mv /tmp/rollback.sh /var/www/rrms/rollback.sh && chmod +x /var/www/rrms/rollback.sh

        echo ">> Restarting rrms-backend..."
        systemctl restart rrms-backend

        echo ">> Waiting for backend to start..."
        i=0
        while [ $i -lt 12 ]; do
          sleep 5
          i=$((i+1))
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:7000/api/v1/search 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "000" ]; then
            echo ">> Backend UP (HTTP $HTTP_CODE) after $((i*5))s"
            exit 0
          fi
          echo "   Attempt $i/12: not ready (HTTP $HTTP_CODE)..."
        done
        echo "ERROR: Backend did not start within 60s"
        systemctl status rrms-backend --no-pager || true
        exit 1
      '

    # Telegram: thành công
    - |
      if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=✅ <b>RRMS deploy THÀNH CÔNG</b>
      👤 <b>Người thực hiện:</b> ${GITLAB_USER_NAME}
      📝 <b>Commit:</b> ${CI_COMMIT_MESSAGE}
      🔗 <a href='https://rrms.click'>Xem website</a>"
      fi

  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
        apk add --no-cache curl 2>/dev/null || true
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=❌ <b>RRMS deploy THẤT BẠI!</b>
        👤 <b>Người thực hiện:</b> ${GITLAB_USER_NAME}
        📝 <b>Commit:</b> ${CI_COMMIT_MESSAGE}
        🔍 <a href='${CI_PIPELINE_URL}'>Xem chi tiết log lỗi</a>" || true
      fi
  only:
    - main
  environment:
    name: production
    url: https://rrms.click

# ═══════════════════════════════════════════════════════════════
# STAGE 4: ROLLBACK (thủ công)
# ═══════════════════════════════════════════════════════════════
# Cách dùng: GitLab → CI/CD → Pipelines → Run pipeline
# Thêm biến: ROLLBACK_RELEASE=20260724_152000

rollback:production:
  stage: rollback
  image: alpine:latest
  when: manual
  allow_failure: false
  before_script:
    - apk add --no-cache openssh-client sshpass curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
  script:
    - |
      if [ -z "$ROLLBACK_RELEASE" ]; then
        echo "ERROR: Biến ROLLBACK_RELEASE chưa được đặt."
        echo "Hãy chạy pipeline với biến ROLLBACK_RELEASE=<tên thư mục release>"
        exit 1
      fi
    - |
      sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
        set -e
        RELEASE_DIR=\"/var/www/rrms/releases/${ROLLBACK_RELEASE}\"
        if [ ! -d \"\$RELEASE_DIR\" ]; then
          echo 'ERROR: Không tìm thấy release' \"\$RELEASE_DIR\"
          ls /var/www/rrms/releases/
          exit 1
        fi
        echo \">> Rolling back to: \$RELEASE_DIR\"
        [ -f \"\$RELEASE_DIR/rrms-0.0.1-SNAPSHOT.jar\" ] && \
          cp \"\$RELEASE_DIR/rrms-0.0.1-SNAPSHOT.jar\" /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar
        if [ -d \"\$RELEASE_DIR/dist\" ]; then
          rm -rf /var/www/rrms/client/dist
          cp -r \"\$RELEASE_DIR/dist\" /var/www/rrms/client/dist
        fi
        systemctl restart rrms-backend
        echo '>> Rollback hoàn tất!'
      "
    - |
      if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=🔄 <b>RRMS ROLLBACK THÀNH CÔNG</b>
      👤 <b>Người thực hiện:</b> ${GITLAB_USER_NAME}
      ⏪ <b>Phiên bản:</b> ${ROLLBACK_RELEASE}
      🔗 <a href='https://rrms.click'>Xem website</a>"
      fi
  only:
    - main
