# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=test_app_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.security.oauth2.client.registration.google.client-id=test_google_id
spring.security.oauth2.client.registration.google.client-secret=test_google_secret
spring.security.oauth2.client.registration.google.scope=email,profile


# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway - disable for unit tests to speed up, or enable if testing migrations
spring.flyway.enabled=false

# Cấu hình các biến khác giả lập
JWT_SIGNER=test_signer_key_32_chars_long_exactly_!!!
jwt.signer-key=test_signer_key_32_chars_long_!!!
jwt.valid-duration=3600
jwt.refreshable-duration=360000
SECRET_KEY_CAPTCHA=test_captcha
GOOGLE_CLIENT_ID=test_google_id
GOOGLE_CLIENT_SECRET=test_google_secret
MY_GMAIL=test@gmail.com
MY_PASSWORD_APP=test_app_pass
PAYPAL_CLIENT_ID=test_paypal_id
PAYPAL_SECRET=test_paypal_secret
STRIPE_PUBLIC_KEY=test_stripe_public
STRIPE_SECRET_KEY=test_stripe_secret
stripe.api.publicKey=test_stripe_public
stripe.api.secretKey=test_stripe_secret
vnpay.api.secretKey=test_vnpay_secret
MOMO_PARTNER_CODE=test_momo_partner
MOMO_ACCESS_KEY=test_momo_access
MOMO_SECRET_KEY=test_momo_secret
MOMO_ENDPOINT=http://localhost:7000
VNPAY_SECRET_KEY=test_vnpay_secret

# Disable Redis during tests if possible, or use embedded
spring.data.redis.repositories.enabled=false
spring.cache.type=none

# Elasticsearch - point to non-existent port so it fails fast, then exclude via @SpringBootTest
spring.elasticsearch.uris=http://localhost:9299
spring.data.elasticsearch.repositories.enabled=false

# Cấu hình trực tiếp cho các @Value placeholder giải quyết dứt điểm lỗi context load
cors.allowed-origins=http://localhost:5173
cloud-flare.captcha.secret=test_captcha
momo.partnerCode=test_momo_partner
momo.accessKey=test_momo_access
momo.secretKey=test_momo_secret
momo.endpoint=http://localhost:7000
momo.notifyUrl=http://localhost:7000/payment/momo-callback
momo.returnUrl=http://localhost:7000/payment/paymentMoMoSuccess
paypal.successUrl=http://localhost:7000/payment/paypal/success
paypal.cancelUrl=http://localhost:7000/payment/paypal/cancel
paypal.client.id=test_paypal_id
paypal.client.secret=test_paypal_secret
paypal.mode=sandbox
