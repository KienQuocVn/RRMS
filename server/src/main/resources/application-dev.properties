# Hồ sơ "dev" (kích hoạt: SPRING_PROFILES_ACTIVE=dev — xem server/.env.example)
# Bổ trợ Flyway: tạo/cập nhật thêm các bảng/cột mapping còn thiếu so với Entity (không thay Flyway làm nguồn chính cho prod).
spring.jpa.hibernate.ddl-auto=update

# Cho phép request JSON lớn hơn khi lưu ảnh base64 trong bulletin board
spring.codec.max-in-memory-size=20MB
server.tomcat.max-http-form-post-size=20MB

# Dev local + MySQL/Redis trong Docker (đọc từ .env gốc: MYSQL_PORT thường là 3307)
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3307}/${DB_NAME:rrms}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Docker Compose: hostname service thay cho localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

cloud-flare.captcha.secret=${SECRET_KEY_CAPTCHA:}
