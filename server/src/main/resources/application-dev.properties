# Hồ sơ "dev" (kích hoạt: SPRING_PROFILES_ACTIVE=dev)
# Bổ trợ Flyway: tạo/cập nhật thêm các bảng/cột mapping còn thiếu so với Entity
spring.jpa.hibernate.ddl-auto=update

# Cho phép request JSON lớn hơn khi lưu ảnh base64 trong bulletin board
spring.codec.max-in-memory-size=20MB
server.tomcat.max-http-form-post-size=20MB

# Dev local + MySQL/Redis trong Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:rrms}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Docker Compose: hostname service thay cho localhost
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:8081,http://127.0.0.1:8081}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}

cloud-flare.captcha.secret=${SECRET_KEY_CAPTCHA:}
