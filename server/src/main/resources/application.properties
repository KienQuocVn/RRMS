#Application Config
spring.application.name=rrms
server.port=${PORT:7000}
spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties],optional:file:../server/.env[.properties]
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}






#Redis Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=5s






#Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/rrms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver






# JPA Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Flyway Config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true






#Cors Config
cors.allowed-origins=https://rrms.vercel.app,http://localhost:5173,https://decent-highly-bass.ngrok-free.app






cloud-flare.captcha.secret=${SECRET_KEY_CAPTCHA:}




#JWT token signerkey
jwt.signer-key=${JWT_SIGNER:}
jwt.valid-duration=3600
jwt.refreshable-duration=360000


# OAuth2 Login with Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:rrms-google-client-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:rrms-google-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/oauth2/callback/google




#Config send mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_GMAIL:}
spring.mail.password=${MY_PASSWORD_APP:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




#Paypal
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_SECRET:}
paypal.mode=sandbox




# Stripe
stripe.api.publicKey=${STRIPE_PUBLIC_KEY:}
stripe.api.secretKey=${STRIPE_SECRET_KEY:}


#MoMo
momo.partnerCode=${MOMO_PARTNER_CODE:MOMOLRJZ20181206}
momo.accessKey=${MOMO_ACCESS_KEY:}
momo.secretKey=${MOMO_SECRET_KEY:}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api
momo.notifyUrl=${MOMO_NOTIFY_URL:http://localhost:8080/payment/momo-callback}
momo.returnUrl=${MOMO_RETURN_URL:http://localhost:8080/payment/paymentMoMoSuccess}


#Paypal URLs
paypal.successUrl=${PAYPAL_SUCCESS_URL:http://localhost:8080/payment/paypal/success}
paypal.cancelUrl=${PAYPAL_CANCEL_URL:http://localhost:8080/payment/paypal/cancel}


##Configuration for development environment
DEV_MOMO_ENDPOINT=https://test-payment.momo.vn/v2/gateway/api
DEV_ACCESS_KEY=${MOMO_ACCESS_KEY:}
DEV_PARTNER_CODE=${MOMO_PARTNER_CODE:MOMOLRJZ20181206}
DEV_SECRET_KEY=${MOMO_SECRET_KEY:}


## AIOv2
CREATE_URL=/create
QUERY_URL=/query
REFUND_URL=/refund
CONFIRM_URL=/confirm
TOKEN_PAY_URL=/tokenization/pay
TOKEN_BIND_URL=/tokenization/bind
TOKEN_INQUIRY_URL=/tokenization/cbQuery
TOKEN_DELETE_URL=/tokenization/delete


## vnpay
vnpay.api.secretKey=${VNPAY_SECRET_KEY:}

# ---- Actuator / Prometheus metrics ----
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=rrms-backend
