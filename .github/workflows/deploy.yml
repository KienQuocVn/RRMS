# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runner cài trên VPS — miễn phí, không giới hạn minutes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Build backend Spring Boot ----------
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Cấp quyền thực thi cho mvnw
        working-directory: server
        run: chmod +x mvnw

      - name: Tạo file test.properties
        working-directory: server
        run: |
          if [ -f src/test/resources/application-test.properties ]; then
            cp src/test/resources/application-test.properties src/test/resources/test.properties
          fi

      - name: Build .jar
        working-directory: server
        env:
          HOME: /root
        run: ./mvnw -B package -DskipTests

      # ---------- 2. Build frontend React ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # ---------- 3. Deploy trực tiếp trên VPS (không cần SCP/SSH) ----------
      - name: Backup và deploy lên VPS
        run: |
          set -e

          mkdir -p /var/www/rrms/server/target \
                   /var/www/rrms/client \
                   /var/www/rrms/releases

          # Backup bản hiện tại
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          RELEASE_DIR="/var/www/rrms/releases/${TIMESTAMP}_${{ github.sha }}"
          mkdir -p "$RELEASE_DIR"

          echo ">> Backing up to $RELEASE_DIR"
          [ -f /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar ] && \
            cp /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar "$RELEASE_DIR/"
          [ -d /var/www/rrms/client/dist ] && \
            cp -r /var/www/rrms/client/dist "$RELEASE_DIR/"

          # Giữ 5 bản backup gần nhất
          cd /var/www/rrms/releases
          ls -1t | tail -n +6 | xargs -I{} rm -rf {}
          cd - > /dev/null

          # Copy jar mới (runner đang ở thư mục workspace trên VPS)
          JAR=$(ls server/target/*.jar | grep -v original | head -n 1)
          echo ">> Deploying $JAR"
          cp "$JAR" /var/www/rrms/server/target/rrms-0.0.1-SNAPSHOT.jar

          # Copy frontend dist mới
          rm -rf /var/www/rrms/client/dist
          cp -r client/dist /var/www/rrms/client/dist

          # Copy rollback script
          if [ -f scripts/rollback.sh ]; then
            cp scripts/rollback.sh /var/www/rrms/rollback.sh
            chmod +x /var/www/rrms/rollback.sh
          fi

          # Restart backend
          echo ">> Restarting rrms-backend..."
          systemctl restart rrms-backend

          # Kiểm tra backend sống
          echo ">> Waiting for backend..."
          for i in $(seq 1 12); do
            sleep 5
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 3 http://127.0.0.1:7000/api/v1/search 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ]; then
              echo ">> Backend UP (HTTP $HTTP_CODE) after $((i*5))s"
              exit 0
            fi
            echo "   Attempt $i/12: not ready (HTTP $HTTP_CODE)..."
          done
          echo "ERROR: Backend did not start within 60s"
          systemctl status rrms-backend --no-pager || true
          exit 1

      # ---------- 4. Thông báo Telegram ----------
      - name: Telegram — deploy thành công
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=HTML \
            --data-urlencode text="✅ <b>RRMS deploy THÀNH CÔNG</b>
          👤 <b>Người thực hiện:</b> ${{ github.actor }}
          📝 <b>Commit:</b> ${{ github.event.head_commit.message }}
          🔗 <a href='https://rrms.click'>Xem website</a>"

      - name: Telegram — deploy thất bại
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=HTML \
            --data-urlencode text="❌ <b>RRMS deploy THẤT BẠI!</b>
          👤 <b>Người thực hiện:</b> ${{ github.actor }}
          📝 <b>Commit:</b> ${{ github.event.head_commit.message }}
          🔍 <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Xem chi tiết log lỗi</a>"
